server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: behind Traefik the internal port/scheme must not leak into redirects
    absolute_redirect off;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    include /etc/nginx/snippets/security-headers.conf;

    error_page 404 /404.html;

    # Build/source files copied into the web root by the Dockerfile — never serve them
    location ~ ^/(Dockerfile|nginx\.conf|security-headers\.conf|scss/) {
        return 404;
    }

    # Static assets: cache 1 year
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Canonical URLs have no .html: redirect /termos-de-uso.html -> /termos-de-uso
    location ~ ^/(termos-de-uso|politica-de-privacidade|politica-de-cookies)\.html$ {
        return 301 /$1;
    }
    location = /index.html {
        return 301 /;
    }

    # HTML: no cache
    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        internal;
    }

    # Legal pages
    location ~ ^/(termos-de-uso|politica-de-privacidade|politica-de-cookies)$ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /$1.html =404;
    }

    location = /robots.txt {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files /robots.txt =404;
    }

    location = /sitemap.xml {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600";
        try_files /sitemap.xml =404;
    }

    # Home; anything else is a real 404 (no SPA fallback: this is a static site)
    location = / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri =404;
    }
}
