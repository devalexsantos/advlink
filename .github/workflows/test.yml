name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    runs-on: ubuntu-latest
    # Real Postgres for the billing integration tests (lib/billing/__tests__/*.db.test.ts)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: advlink
          POSTGRES_PASSWORD: advlink
          POSTGRES_DB: advlink_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U advlink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_TEST: postgresql://advlink:advlink@localhost:5432/advlink_test
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Migrate test database
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL_TEST }}

      # TODO: remover continue-on-error quando zerar a dívida (53 erros de lint, ~17 de tsc em 2026-10-09)
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        continue-on-error: true
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --coverage

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: web/coverage/
          retention-days: 7
